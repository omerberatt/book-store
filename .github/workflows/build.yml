# Builds and tests every push to main and every pull request (ADR-0017, ADR-0022).
# The runner has Docker, so the repository contract tests also run on PostgreSQL 17 through
# Testcontainers; locally they are skipped without Docker.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test, PostgreSQL tests included
        run: ./mvnw -B -ntp verify

      - name: Count the tests that ran on PostgreSQL
        if: always()
        run: |
          grep -h -o 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' \
            $(find . -path '*/surefire-reports/TEST-*Postgres*.xml') | sort | uniq -c || true

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
